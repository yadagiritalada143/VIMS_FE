<svms-sidebar size="small" title="Edit Details" [dataVisibility]="detailsPanel" (onClose)="sidebarClose()">
  <svms-sidebar-body>
    <div class="p-24" [formGroup]="offerDetailForm">
      <div class="form-group-row mb-16">
        <div class="form-group">
          <label> {{ 'start_date' | i18next }} </label>
          <svms-datepicker [inputdateFormat]="'MM/DD/YY'" formControlName="startDate" id="date1" I18n>
          </svms-datepicker>
        </div>
        <div class="form-group">
          <label> {{ 'end_date' | i18next }} </label>
          <svms-datepicker [inputdateFormat]="'MM/DD/YY'" formControlName="endDate" id="date1" I18n>
          </svms-datepicker>
        </div>
      </div>
      <!-- <div class="form-group-row">
        <div class="form-group">
          <label>
            Timesheet Manager <span class="require">*</span>
          </label>
          <ng-select placeholder="Manager Name" formControlName="manager">
            <ng-option [value]="'1'">1</ng-option>
            <ng-option [value]="'2'">2</ng-option>
          </ng-select>
        </div>
      </div> -->

      <div class="my-32">
        <h4><strong>{{ 'pay_rate_negotiation' | i18next }}</strong> </h4>
        <div class="form-group-row mt-20">
          <div class="form-group">
            <label> {{ 'old_pay_rate' | i18next }}</label>
            <input type="text" class="form-control" placeholder="$0.00" formControlName="oldRate" readonly>
          </div>
          <div class="form-group">
            <label> {{ 'new_pay_rate' | i18next }}</label>
            <input type="text" class="form-control" placeholder="$0.00" formControlName="rate">
          </div>
        </div>
      </div>
    </div>
  </svms-sidebar-body>

  <svms-sidebar-footer>
    <button type="submit" class="btn btn-primary float-right" (click)="saveDetails()">
      <icon size="20px" name="check_circle" type="material" class="icon--on-left" cuClass="icon-cu"></icon>
      {{ 'save' | i18next }}
    </button>
  </svms-sidebar-footer>
</svms-sidebar>
