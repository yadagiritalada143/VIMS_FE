<svms-sidebar title="Update Interview" [dataVisibility]="'visible'" (onClose)="closeSidebar()">
    <svms-sidebar-body>
        <div class="update-interview-sidebar p-24">
            <form [formGroup]='form' action="">
                <div class="form-group">
                    <label>{{ 'candidate_phone_number' | i18nextEager }}<span class="require">*</span></label>
                    <div class="d-flex align-items-center country-searchable position-relative border-grey">
                        <div class="col-md-2 p-0 border-right">
                            <ng-select [searchable]="true" [loading]="countryLoading" [clearable]="false"
                                formControlName="phone_isdcode" ngDefaultControl (change)="phoneLengthValidation()">
                                <ng-option *ngFor="let country of allCountryList" [value]="country.iso_code_2">
                                    <div class="d-flex" [attr.title]="country?.name">
                                        <img src="../../../assets/images/flag/{{country.iso_code_2.toLowerCase()}}.png"
                                            width="20px" class="mr-4" />
                                        <span>+{{country.isd_code}}</span>
                                    </div>
                                </ng-option>
                            </ng-select>
                        </div>
                        <input type="number" class="form-control"
                            placeholder="{{ 'enter_phone_number' | i18nextEager }}" formControlName="phone"
                            (keypress)="keyPressNumbers($event)">
                    </div>
                    <p class="validation-msg" *ngIf="
                    (form.controls.phone.touched) && form.controls['phone'].errors?.required">
                        <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>
                        {{ 'phone_number_is_required' | i18next }}
                    </p>
                    <p class="validation-msg"
                        *ngIf="
                    (form.controls.phone.touched || form.controls.phone.dirty) && form.controls['phone'].errors?.pattern">
                        <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>
                        {{ 'invalid_phone_number' | i18next }}
                    </p>
                </div>
                <div *ngIf="interview_type?.toUpperCase()=== 'VIRTUAL'" class="form-group">
                    <label>{{ 'candidate_email_id' | i18nextEager }} <span class="require">*</span> </label>
                    <div class="d-flex position-relative border-grey">
                        <icon name="mail" class="d-flex align-items-center justify-content-center border-right px-12"
                            cuClass="d-flex" theme="outlined" color="#000000" size="18px"></icon>
                        <input type="text" class="form-control" formControlName="candidate_email"
                            placeholder="{{'Enter Email Address' | i18next}}">
                    </div>
                    <p class="validation-msg"
                        *ngIf="((form.controls.candidate_email.touched && form.controls['candidate_email'].errors) || (form.controls['candidate_email'].errors))">
                        <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>{{
                        'email_address_is_not_valid' | i18next }}.
                    </p>
                </div>
            </form>
        </div>
    </svms-sidebar-body>
    <svms-sidebar-footer>
        <button type="submit" class="btn submit-btn float-right" (click)="updateInterview()">
            <icon name="check" class="d-flex justify-content-between align-item-center mr-4" cuClass="d-flex"
                theme="outlined" color="#fffff" size="20px"></icon>
            {{'Update' | i18next}}
        </button>
    </svms-sidebar-footer>
</svms-sidebar>
