<div *ngIf="resumeURL !=null">
  <ngx-doc-viewer
  [url]="resumeURL"
  viewer="google"
  googleCheckContentLoaded = true
  style="height:100vh;"
  googleCheckInterval = 3000
></ngx-doc-viewer>
</div>
<div *ngIf="isLoading" class="d-flex justify-content-center loader-height align-items-center p-24 img_height">
  <div class="dotloader"></div>
</div>
<div class="d-flex justify-content-center align-items-center p-24">
  <div *ngIf="!resumeURL" class="no-data text-align-center text-center pt-64">
    <icon name="article" size="60px" color="#4267b2" type="material" theme="outlined" class="mr-8"></icon>
    <h5 class="pt-4 mb-0">{{ 'no_resume_added_yet' | i18next }}</h5>
  </div>
</div>
