<svms-sidebar [title]="'User Assigned To '+roleName+' Role'" [dataVisibility]="usersAssigned"
    (onClose)="sidebarClose()">
    <div>
        <svms-sidebar-body>
            <vms-table *ngIf='resetTrigger'
                [vmsTableConfig]="tableConfig" 
                [vmsDataSource]="vmsData" 
                [loading]="tableLoading"
                [totalItem]="totalRecords" 
                [itemsPerPage]="itemsPerPage" 
                (changePage)="onPaginationClick($event)"
                (onViewClick)="onClickView($event)" 
                (onDeleteClick)="onDeleteClick($event)"
                (onDisableClicked)="onDisableClicked($event)" 
                (onEditClick)="onEditClick($event)">
            </vms-table>
        </svms-sidebar-body>
    </div>
</svms-sidebar>
