<vms-table
    [totalItem]="totalRecords"
    [itemsPerPage]="recordCount"
    [loading]="tableLoading"
    [vmsTableConfig]="tableConfig"
    [vmsDataSource]="vmsData"
    [currentPage]="currentPage"
    (changePage)="changeCurrentPage($event)"
    (changeRecords)="changeItemsPerPage($event)"
    (onCreate)="onCreateClick($event)"
    (onEditClick)="onEditClick($event)"
    (onDisableClicked)="onDisableClick($event)"
    (onSort)="onSortClick($event)"
    (onNameClick)="onViewClick($event)"
    (search)="onSearch($event)"
    (onListFilter)="onFilter($event)"
>
</vms-table>

<app-picklist-flyout
    [(visible)]="sidebarVisibility"
    (sidebarClosed)="refreshList($event)"
>
</app-picklist-flyout>
