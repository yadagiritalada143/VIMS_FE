<section class="mb-24">
    <div class="form-group mb-8">
        <div class="file-input" (click)="uploadFileInput.click()">
            <input hidden class="file-field" type="file" [accept]="acceptFileTypes" #uploadFileInput
                (change)="uploadFile($event)" [disabled]="isDisable">
            <div class="styled-interface">
                <input type="text" class="form-control"
                    placeholder="{{'Drag files here or click \'Browse\' to upload' | i18next}}">
                <button class="btn btn-light">{{'Browse' | i18next}}</button>
            </div>
        </div>
    </div>
    <div *ngFor="let file of uploadedFileArr, let i = index"
        class="list-item d-flex align-items-center justify-content-between column-direction">
        <div *ngIf="file" class="file-name d-flex align-items-center">
            <icon name="description" cuClass="d-flex" color="#0021F5" size="24px" class="mr-8"></icon>
            <span>{{file.name || file.file_name}}</span>
        </div>
        <div class="d-flex align-items-center file-upload-tool">
            <app-toggle (changed)="file.is_vendor_allowed_to_view = !file.is_vendor_allowed_to_view"
                [checked]="file.is_vendor_allowed_to_view"></app-toggle>
            <p class="ml-4 mr-8">{{'allow_vendors_to_view' | i18next}}</p>
            <icon name="download" type="symbols" color="#0044C5" (click)="downloadAttachment(file)"
                class="download cursor-pointer" title="{{'Download' | i18next}}"></icon>
            <icon name="delete_forever" type="symbols" color="#FF0000" (click)="deleteFile(i)"
                class="delete cursor-pointer" title="{{'delete' | i18next}}"></icon>
        </div>
    </div>
</section>
