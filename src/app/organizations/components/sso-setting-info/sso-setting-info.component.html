<div class="column-direction">
  <div class="toggle-panel mb-16" [ngClass]="{ disable: true }">
    <div class="toggle-panel-inner" [ngClass]="ssoInfo?.is_enabled ? 'if-active' : 'if-inactive'">
      <span class="status-text">{{ 'sso' | i18next }}</span>
      <span class="toggle-switch" [ngClass]="ssoInfo?.is_enabled ? 'toggle-on' : 'toggle-off'"></span>
    </div>
  </div>

  <ng-container *ngIf="ssoInfo?.is_enabled">
    <div class="d-flex align-items-center justify-content-start mb-16">
      <span class="text-black mr-16">{{'sso_provider'|i18next}}</span>
      <span class="text-black d-flex">
        <span class="badge badge-lightblue rounded-sm mr-4 text-uppercase">{{ssoInfo?.provider_name}}</span>
        </span>
    </div>

    <div class="d-flex align-items-center justify-content-start mb-16">
      <span class="text-black mr-16">{{'enable_sso_for_user_types'|i18next}}</span>
      <span class="text-black d-flex" *ngFor="let option of ssoInfo?.user_type">
        <span class="badge badge-lightblue rounded-sm mr-4 text-uppercase">{{option}}</span>
        </span>
    </div>

    <div class="d-flex align-items-center justify-content-start mb-16">
      <span class="text-black mr-16">{{'force_enabled'|i18next}}</span>
      <input type="checkbox" [checked]="ssoInfo?.is_forced" [disabled]="true" name="ssoForce">
    </div>

  </ng-container>

</div>
