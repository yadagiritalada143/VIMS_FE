<h4 class="font-weight-medium mb-24 text-truncate" tooltip="{{currentAccountInfo.first_name}} {{currentAccountInfo.last_name}}" placement="right">{{currentAccountInfo.first_name}} {{currentAccountInfo.last_name}}</h4>
<ul>
    <li class="cursor-pointer" [ngClass]="currentTab == 'my_library' ? 'active' : ''">
        <div class="d-flex align-items-center" (click)="changeRoute('my_library')">
            <icon name="folder_open" theme="outlined"></icon> <span>My Library</span>
        </div>
    </li>
    <li class="cursor-pointer" [ngClass]="currentTab == 'favorites' ? 'active' : ''">
        <div class="d-flex align-items-center" (click)="changeRoute('favorites')">
            <icon name="grade"  theme="outlined"></icon> <span>Favorites</span>
        </div>
    </li>
</ul>
