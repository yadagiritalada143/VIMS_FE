<div class="help-bar-wrapper" *ngIf="help">
  <div class="help-bar">
    <div class="icon-wrapper d-flex justify-content-center align-items-center">
      <sidebar-icon size="24px" color="#ffffff" name="help" type="material" cuClass="icon d-flex"></sidebar-icon>
    </div>
    <p class="font-weight-medium my-8">{{helpTitle|i18next}}</p>
    <p class="small grey-color">{{helpText|i18next}}</p>
  </div>
</div>
