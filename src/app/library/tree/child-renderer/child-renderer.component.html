<ul class="sub-level-listing">
    <li>
        <div class="listing-item" [ngStyle]="{'padding-left': (childRenderData?.hierarchy_level)*30 + 'px'}" [ngClass]="{'active': checkboxState}">
            <div class="listing-info">
                <span class="sub-level-title">{{childRenderData?.name|i18next}}</span>
            </div>
            <div class="level-status">
                <div class="checkbox-wrapper">
                    <label class="checkbox-container">
                      <input type="checkbox" name="hierarchy_level" [(ngModel)]="checkboxState" (change)="onSelectLevel()">
                      <span class="checkmark"></span>
                    </label>
                </div>
            </div>
        </div>
        <app-child-renderer
        *ngFor="let childLevel of childRenderData?.hierarchies"
        [childRenderData]="childLevel"
        [parentCheckboxState]="checkboxState"
        (selectHierarchyLevel)="selectParent($event)"
        [selectedTreeArr]="selectedTreeArr"
        ></app-child-renderer>
    </li>
</ul>
