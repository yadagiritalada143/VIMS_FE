<app-tree-header *ngIf="viewBlock === true" [treeConfig]="treeConfig" (onSetting)="onSettingClick($event)" (onSearch)="searchHierarchy($event)" [flattednedHierarchy]="flattednedHierarchy" (onListFilter)="searchFilter($event)"></app-tree-header>
<app-tree-content
    [vmsTreeDataSource]="vmsTreeDataSource"
    [flattednedHierarchy]="flattednedHierarchy"
    [treeConfig]="treeConfig"
    [viewBlock]="viewBlock"
    (disableClicked)="onDisableClick($event)"
    (deleteClicked)="onDeleteClick($event)"
    (addSubLevel)="onClickAddSubLevel($event)"></app-tree-content>
