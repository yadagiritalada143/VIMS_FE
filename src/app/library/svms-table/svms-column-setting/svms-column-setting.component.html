<app-svms-modal size="large" title="{{ 'customize_columns' | i18next }}" [visibility]="visibility" (onClose)="onCloseModal($event)">
  <div class="svms-modal-body custom-column-block p-0">
    <div class="col-settings d-flex justify-content-between">
      <aside class="col-settings-sidebar px-32 py-16">
        <h4 class="font-weight-medium">{{ 'available_columns' | i18next }}</h4>
        <div class="mt-24">
          <div class="deselectAll">
            <p class="small text-uppercase">{{ 'default_columns' | i18next }}
            </p>
            <p class="d-flex">
              <input class="mr-8" type="checkbox" [(ngModel)]="deselectAll" [checked]="deselectAll" (change)="onToggleSelectAll()">
              {{ 'deselect_all' | i18next }}
            </p>
          </div>


          <ul>
            <li [ngClass]="{'disabled':index == 0}" *ngFor="let colDef of availableColumns;let index = index">
              <label class="mb-0 c-input-checkbox">
                <input class="mr-8" type="checkbox" [checked]="!colDef?.hidden" (change)="onToggleColumn(colDef)">
                <span class="cb-ui"></span>
                <span class="cb-label">{{colDef?.header|i18next}}</span>
              </label>
            </li>

          </ul>
        </div>
      </aside>
      <div class="col-settings-content px-24 py-16">
        <h4 class="font-weight-medium mb-16">{{ 'selected_columns' | i18next }}</h4>
        <div class="d-flex flex-column px-16 mb-8 reordring-column" dndDropzone dndEffectAllowed="copyMove"
        (dndDrop)="onDrop($event)">
        <div dndPlaceholderRef class="dndPlaceholder"></div>
            <ng-container *ngFor="let colDef of tempSelectedColumns | orderBy: 'order';let i = index">
            <div class="column-item d-flex align-items-center justify-content-between"
            [ngClass]="{'disabled':i===0}"
            [attr.data-index]="i"
            *ngIf="!colDef?.hidden"
            [dndDraggable]="i"
            (dndStart)="onDragStart(i)" [dndDisableIf]="i===0" [dndDisableDragIf]="i===0">
              <div class="d-flex align-items-center">
                <i class="dragable-icon material-icons">drag_indicator</i>
                <span class="ml-24 toggle-name">{{ colDef?.header | i18next }}</span>
              </div>
              <span class="item-status">
                <i class="material-icons">lock</i>
              </span>
            </div>
          </ng-container>
        </div>
      </div>
    </div>
    <div class="text-right py-12 pr-12">
      <button class="c-btn c-btn-primary-medium" (click)="onApplyChange()">{{ 'apply_changes' | i18next }}</button>
    </div>
  </div>
</app-svms-modal>
