<i
  *ngIf="type === 'material'"
  [class]="cuClass ? 'material-icons ' + cuClass : 'material-icons icon-default'"
  [style.color]="color"
  [style.fontSize]="size"
  >{{ name }}</i
>
<i
  *ngIf="type === 'custom'"
  [class]="cuClass ? 'custom-icon ' + cuClass + ' cu-' + name : 'custom-icon icon-default cu-' + name"
  [style.color]="color"
  [style.fontSize]="size"
></i>
