<ng-template #masterTypeStatus let-row let-value="value">
    <span class="c-status-ui active" *ngIf="value">
      {{ 'active' | i18next }}
    </span>
    <span class="c-status-ui inactive" *ngIf="!value">
      {{ 'inactive' | i18next }}
    </span>
  </ng-template>
<app-svms-table [tableOptions]="tableOptions" [dataSource]="vmsData"
    [coloumnDefintions]="svmstableColomnDefn"  (search)="onSearch($event)" ></app-svms-table>
