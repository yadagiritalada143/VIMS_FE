<svms-sidebar [title]="title" [message]="confirmationMessage" [needConfirmation]="!isViewClicked" icon="supervised_user_circle" [dataVisibility]="createRoleUser"
  (onClose)="sidebarClose()" [clickOutside]="readOnly">
  <svms-sidebar-body>
    <vms-tab-group [selectedIndex]="tabIndex" (onSelectedIndexChange)="onIndexChange($event)">
      <vms-tab label="Basic Info">

        <div class="form-group-row mb-32">
          <div class="form-group">
            <label>{{ 'role_name' | i18next }} <span class="require">*</span> </label>
            <input [readonly]="readOnly" type="text" placeholder="{{ 'custom_user_role' | i18next }}" class="form-control"
              [(ngModel)]="_role.name">
          </div>
          <div class="toggle-panel" [ngClass]="{'disable':isViewClicked}">
            <div class="toggle-panel-inner toggle-background"
              [ngClass]="_role?.is_enabled ? 'if-active' : 'if-inactive'">
              <span class="status-text">{{toggle?.title}}</span>
              <span class="toggle-switch" [ngClass]="toggle?.value ? 'toggle-on' : 'toggle-off'"
                (click)="onClickToggle()"></span>
            </div>
          </div>
        </div>

        <h4>{{ 'modules' | i18next }}</h4>
        <app-modules [readOnly]="readOnly" [moduleData]="moduleGroup" (moduleDataChange)="onClickModule($event)">
        </app-modules>
      </vms-tab>

      <vms-tab label="Permissions">
        <app-permissions [readOnly]="readOnly" [(moduleGroup)]="moduleGroup"></app-permissions>
      </vms-tab>

    </vms-tab-group>
  </svms-sidebar-body>

  <svms-sidebar-footer>
    <ng-container *ngIf="!readOnly">
      <button class="btn btn-outline float-left" (click)="sidebarClose()"> {{ 'cancel' | i18next }} </button>

      <!--show this in basic info tabs tabs -->
      <button type="submit" class="btn btn-primary float-right" (click)="onContinue()" *ngIf="tabIndex === 0"
        [disabled]="continueDisbled">
        {{ 'continue' | i18next }} <icon size="20px" name="chevron_right" type="material" class="icon--on-right" cuClass="icon-cu"></icon>
      </button>

      <!--show this in permissons tabs -->
      <button [disabled]="continueDisbled" type="submit" class="btn btn-primary float-right" *ngIf="tabIndex === 1"
        (click)="onSave()">
        <icon *ngIf="!isSaveLoader" size="20px" name="check_circle" type="material" class="icon--on-right" cuClass="icon-cu"></icon>
        <span *ngIf="isSaveLoader" class="ml-8"><button-loader></button-loader></span>
        &nbsp;&nbsp;{{ 'save' | i18next }}
      </button>
    </ng-container>

  </svms-sidebar-footer>
</svms-sidebar>
