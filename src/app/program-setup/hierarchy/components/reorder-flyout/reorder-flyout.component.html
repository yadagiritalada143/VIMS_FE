<svms-sidebar 
  [title]="'Reorder Master Data Type'"
  [dataVisibility]="visibility"
  (onClose)="sidebarClose()"
>

  <svms-sidebar-body>
    
    <div class="no-data align-justify-center mt-24 pt-24" *ngIf="!vmsData || vmsData.length == 0">
      {{ 'no_custom_fields_available' | i18next }}
    </div>

    <div class="p-16">
      <div *ngIf="vmsData && (vmsData.length > 0)" class="d-flex flex-column px-16 mb-8 reordering-column" dndDropzone
        dndEffectAllowed="copyMove" (dndDrop)="onDrop($event)">
        <div dndPlaceholderRef class="dndPlaceholder"></div>
        <div class="mb-16 d-flex align-items-center rounded-sm reordering-item p-16 text-dark"
          *ngFor="let data of vmsData, let i = index" [attr.data-index]="i" [dndDraggable]="data"
          (dndStart)="onDragStart(i)" [class.dnone]="(i===0) ||
          (i==vmsData?.length - 1)">
          <span class="drag cursor-pointer  d-flex align-items-center w-100">
            <table-icon size="20px" name="drag_indicator" type="material" cuClass="d-flex mr-8" class="d-flex ">
            </table-icon>
            {{data.name}}
          </span>
        </div>
      </div>
    </div>

  </svms-sidebar-body>

  <svms-sidebar-footer>
    <button type="submit" 
      class="btn btn-primary float-right"
      (click)="saveReordering()">
        {{ 'save' | i18next }} <icon size="20px" name="chevron_right" type="material" class="icon--on-right" cuClass="icon-cu"></icon>
    </button>
  </svms-sidebar-footer>

</svms-sidebar>
