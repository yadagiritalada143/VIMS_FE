<div *ngIf="previewMode == 'email' && previewContent" (click)="contentClicked()">
    <div [innerHTML]="previewContent | safeHtml"></div>
</div>

<div class="preview-container-sms" *ngIf="previewMode == 'sms'">
    <div [innerHTML]="htmlsms | safeHtml"></div>
</div>

<div class="preview-container-notify" *ngIf="previewMode == 'notification'">
    <div [innerHTML]="htmlnotification | safeHtml"></div>
</div>
