<div class="notification-page-wrapper">
<div class="card">
  <app-logs [log]="logs"></app-logs>
  <div class="d-flex align-items-center justify-content-start border-bottom pl-16">
    <span class="cur material-icons pr-8" (click)="navigateback()">
      arrow_back
    </span>
    <h5>{{title}} </h5>
  </div>

<form [formGroup]="emailAddForm">
  <div class="p-24 d-flex align-items-center justify-content-center domain-main">
    <div class="form-group mb-0 pb-0">
      <label for="">{{ 'enter_email_address' | i18next }} <span class="text-danger"> *</span></label>
      <input  type="text" placeholder="{{ ('enter_email_address_to_added_in'| i18next) + inputpaceholder}}" class="form-control" formControlName="email" >
    </div>
    <button class="btn btn-success ml-16 mt-24 domain-addbtn" (click)="addEmailtoListAsPerType()" [disabled]="!emailAddForm.valid" *accessControl>
      {{this.addBtnCaption}}
    </button>
  </div>
  </form>
  <div class="position-relative search_input">
    <icon class="icon" name="search" size="16px"></icon>
    <input #searchData class="form-control" placeholder="{{ 'search_email' | i18next }}" type="text" (keyup)="setSearchParam(searchData?.value)">
  </div>
  <div class="card-content">
    <section class="table-outer-wrap">
      <div class="table-wrapper">
        <table class="table">
          <thead>
            <tr>
              <th>{{ 'email_address' | i18next }}</th>
              <th class="text-right" *accessControl>{{ 'actions' | i18next }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let email of filteredEmailLists">
              <td>
                {{email}}
              </td>
              <td class="text-right text-black">
                <icon name="delete" size="20px" class="cur" theme="outlined" (click)="deleteEmailFromList(email)" *accessControl></icon>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>
</div>
