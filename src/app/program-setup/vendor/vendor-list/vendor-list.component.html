<vms-table 
    [vmsTableConfig]="tableConfig" 
    [vmsDataSource]="vendorList?.vendors" 
    [open]="isExpand" [totalItem]="totalRecords" 
    [itemsPerPage]="itemPerPage" 
    (onCreate)="onCreateClick($event)" 
    (onViewClick)="onClickView($event)" 
    (onEditClick)="onEditClick($event)" 
    (search)="onSearch($event)" 
    (onDisableClicked)="onDisableClicked($event)" 
    (changePage)="onPaginationClick($event)" 
    (onDeleteClick)="onDeleteClick($event)" 
    (onListFilter)="onListFilter($event)" 
    (onOptionClicked)="onOptionClicked($event)"
></vms-table>

<app-create-vendor 
    [createManageVendor]="createManageVendor" 
    (onClose)="onCloseCreateVendor($event)" 
    [editData]="editData" [viewData]="viewData" 
    [isViewClicked]="viewclick" (onLoadGetVendorList)="onLoadGetVendorList()"
></app-create-vendor>
