<vms-table *ngIf="vmsData" 
    [vmsTableConfig]="tableConfig" 
    [vmsDataSource]="vmsData?.qualifications" 
    [open]="isExpand" [totalItem]="totalRecords" 
    [itemsPerPage]="itemPerpage" 
    (onCreate)="onCreateClick($event)" 
    (onViewClick)="onViewClick($event)" 
    (onEditClick)="onEditClick($event)" 
    (onListFilter)="onListFilter($event)" 
    (changePage)="onPaginationClick($event)" 
    (onDisableClicked)="onDisableClicked($event)" 
    (onDeleteClick)="onDeleteClick($event)" 
    (search)="onSearch($event)" 
    (onBack)="onBackClick()"
>
</vms-table>
<app-create-qualification [isCreateQualificationItem]="isCreateQualificationItem" (onClose)="onCloseCreateQualificationItem($event)"></app-create-qualification>
