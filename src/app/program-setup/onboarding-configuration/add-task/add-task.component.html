<svms-sidebar title="Add Task To List" [dataVisibility]="addTask" (onClose)="sidebarClose()">
    <svms-sidebar-body>
      <form>
        <div class="p-24 cst-content">
          <div class="formGroup">
            <label>{{ 'task_name' | i18next }} <span class="require">*</span></label>
            <ng-select>
              <ng-option [value]="'task_1'">{{ 'task_1' | i18next }}</ng-option>
              <ng-option [value]="'task_2'">{{ 'task_2' | i18next }}</ng-option>
              <ng-option [value]="'task_3'">{{ 'task_3' | i18next }}</ng-option>
              <ng-option [value]="'task_4'">{{ 'task_4' | i18next }}</ng-option>
              <ng-option [value]="'task_5'">{{ 'task_5' | i18next }}</ng-option>
            </ng-select>
          </div>
        </div>
      </form>

    </svms-sidebar-body>
</svms-sidebar>
