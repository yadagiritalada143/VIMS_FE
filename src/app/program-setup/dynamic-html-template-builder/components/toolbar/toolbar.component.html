<div class="content-tool d-flex align-items-center justify-content-between">
    <div class="tool-item" *ngFor="let tool of tools" (click) = 'toolSelected(tool)'>
      <icon size="50px" [name]="tool.iconName" theme="outlined"></icon>
      <span>{{ tool.title | i18next}}</span>
    </div>
  </div>
