<div class="p-24">
    <div class="d-flex align-items-center">
        <h4 class="font-weight-medium mr-8 fs-15 mb-0 text-black">{{ 'interview_review' | i18next }}</h4>
        <i class="info-icon material-icons mr-16"
            [tooltip]="'When enabled, the MSP will be able to review an interview scheduled by HM or any other authorized role before it is sent to the vendor for acceptance.' | i18next"
            placement="right">help</i>
        <toggle-button [checked]="isPendingInterviewReview" (changed)="pendingInterviewReview($event)"></toggle-button>
    </div>
</div>
