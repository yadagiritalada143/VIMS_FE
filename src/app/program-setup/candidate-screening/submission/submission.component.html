<div class="p-24">
    <div class="d-flex align-items-center">
        <h4 class="font-weight-medium mr-8 fs-15 mb-0 text-black">{{ 'is_rehire_approval_required' | i18next }}</h4>
        <i class="info-icon material-icons mr-16"
            [tooltip]="'When enabled, the system will send the vendor submitted rehire candidate for rehire approval.  After this setting is enabled, the &quot;Approve And Reject Rehire Candidate&quot; permission will need to be given to any Program User Role(s) which should be responsible for approving rehires.' | i18next"
            placement="right">help</i>
        <toggle-button [checked]="isRehire" (changed)="onChangeRehire($event)"></toggle-button>
    </div>
</div>
