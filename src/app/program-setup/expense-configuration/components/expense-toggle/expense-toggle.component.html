<div class="toggle-panel-inner" [ngClass]="expenseToggle.value ? 'if-active' : 'if-inactive'">
    <span class="status-text">{{expenseToggle.title | i18next}}</span>
    <span class="toggle-switch" [ngClass]="expenseToggle.value ? 'toggle-on' : 'toggle-off'"
        (click)="onClickExpenseToggle()"></span>
</div>
