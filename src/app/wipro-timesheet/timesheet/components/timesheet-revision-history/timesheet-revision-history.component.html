<div class="revision-history card bg-light mt-24 p-16 mt-m-0" *ngIf="vmsData?.timesheets?.length > 0">
    <h4 class="font-weight-medium mb-12 px-m-16"><icon class="mr-8" name="update"  size="18px" type="material"></icon> {{ 'timesheet_revision_history' | i18next }}</h4>
<vms-table [vmsTableConfig]="tableConfig" [vmsDataSource]="vmsData?.timesheets" [loading]="dataLoading" [totalItem]="totalRecords" [itemsPerPage]="itemPerPage"
     (changePage)="onPaginationClick($event)" [count]="countData" (onViewClick)="onClickView($event)"
    > 
</vms-table>
</div>
