<svms-sidebar title="{{panelTitle | i18next }}" [dataVisibility]="timesheetReject" size="small" (onClose)="sidebarClose()">
  <app-logs [log]="logs"></app-logs>
  <svms-sidebar-body>
    <div class="p-24" [formGroup]="actionForm">
      <div class="form-group">
        <label>{{ 'select_reason_for_rejection' | i18next }} <span class="require">*</span></label>
        <ng-select [clearable]="false" placeholder="{{ 'select' | i18next }}" formControlName="reason">
          <ng-option [value]="reason.id" *ngFor="let reason of reasonList">
            {{reason.name | i18next }}
          </ng-option>
        </ng-select>
      </div>
      <div class="form-group month-selector">
        <label>{{ 'notes' | i18next }}</label>
        <textarea class="form-control no-resize" rows="10" formControlName="notes" maxlength="1000"></textarea>
      </div>
    </div>
  </svms-sidebar-body>
  <svms-sidebar-footer>
    <button class="btn btn-outine float-left" (click)="sidebarClose()">{{ 'cancel' | i18next }}</button>
    <button class="btn btn-primary float-right" [disabled]="isSubmitted" (click)="actionTimesheet()"><icon size="20px" name="check_circle" type="material" class="icon--on-left" cuClass="icon-cu"></icon> {{(actionTitle == 'Rejection' ? 'Reject' : 'Approve') |i18next }}</button>
  </svms-sidebar-footer>
</svms-sidebar>
