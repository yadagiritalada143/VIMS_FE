<svms-sidebar-ng [title]="'Rollback Confirmation' | i18nextEager" [dataVisibility]="vendorPaymentRollbackVisible"
    (onClose)="vendorPaymentRollbackVisible='hidden'">
  <app-logs [log]="logs"></app-logs>
    <div class="sidebar-wrapper">
        <div>
            <div class="pl-24 pr-24 pt-32 pb-32">
                <div class="form-group">
                    <label> {{ 'reason_for_rollback' | i18nextEager }} <span class="require">*</span></label>
                    <ng-select [clearable]="false" placeholder="{{ 'select_reason' | i18nextEager }}" [searchable]="false"
                        [(ngModel)]="reason">
                        <ng-option *ngFor="let reason of vendorRollbackOptions" [value]="reason?.name">{{
                            reason?.name }}</ng-option>
                    </ng-select>
                </div>
                <div class="form-group">
                    <label>{{ 'notes' | i18nextEager }} <span class="require">*</span></label>
                    <textarea class="form-control" placeholder="{{ 'enter_additional_notes' | i18nextEager }}" rows="7"
                        cols="12" maxlength="3000" [(ngModel)]="notes"></textarea>
                </div>
            </div>
        </div>
        <svms-sidebar-footer-ng>
            <button type="button" class="btn btn-outline-danger float-right" (click)="onRollbackPayment()">{{ 'cancel' | i18nextEager }}</button>
            <button type="button" class="btn btn-primary float-right mr-16"
                (click)='onRollbackPayment(false)' [disabled]='!reason || !notes'>
                {{ 'save' | i18nextEager }}
                <span *ngIf="loading" class="loader ml-12"> </span>
            </button>

        </svms-sidebar-footer-ng>
    </div>
</svms-sidebar-ng>
