<svms-sidebar title="{{ 'add_reference' | i18next }}" size="small" [dataVisibility]="visiblity" (onClose)="sideBaClose()">
  <form [formGroup]="referenceForm">
    <svms-sidebar-body>
      <div class="p-24">
        <div class="form-group">
          <label>
            {{ 'company_name' | i18next }} <span class="require">*</span>
          </label>
          <input type="text" formControlName="company_name" class="form-control" placeholder="{{ 'reference_company_name' | i18next }}" />
          <p *ngIf="
            referenceForm.get('company_name').touched &&
                (referenceForm.get('company_name').errors?.pattern || referenceForm.get('company_name').invalid)
              " class="validation-msg">
            <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>
            {{ 'company_name_can_not_be_blank' | i18next }}.
          </p>
          <!-- <ng-select company_name  placeholder="Wipro India">
            <ng-option>
              +91
            </ng-option>
            <ng-option>
              +99 </ng-option>
          </ng-select>
        -->
        </div>

        <div class="form-group">
          <label>
            {{ 'affiliation' | i18next }} <span class="require">*</span>
          </label>
          <input formControlName="affiliation" type="text" class="form-control" placeholder="{{ 'reference_affiliation' | i18next }}" />
          <p *ngIf="
            referenceForm.get('affiliation').touched &&
                (referenceForm.get('affiliation').errors?.pattern || referenceForm.get('affiliation').invalid)
              " class="validation-msg">
            <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>
            {{ 'affiliation_can_not_be_blank' | i18next }}.
          </p>
        </div>
        <div class="row">
          <div class="col-md-12">
            <div class="form-group">
              <label>
               {{ 'phone_number' | i18next }} <span class="require">*</span>
              </label>
              <div class="d-flex align-items-center country-searchable">
                <ng-select [searchable]="true" [clearable]="false" [(ngModel)]="referenceForm.value.phoneFormat" ngDefaultControl formControlName="phoneFormat"
                  >
                  <ng-option *ngFor="let country of allCountryList" [value]="country.iso_code_2">
                    <img src="../../../assets/images/flag/{{country.iso_code_2.toLowerCase()}}.png" width="20px" class="mr-4" />
                    <span>+{{country.isd_code}}</span>
                  </ng-option>
                </ng-select>

                <input formControlName="contact_phone" type="number" class="form-control" [pattern]="'^[0-9]{10}$'" placeholder="{{ 'contact_person_phone_number' | i18next }}"
                  [ngClass]="{'error': referenceForm.controls['contact_phone'].invalid && (referenceForm.controls['contact_phone'].dirty || referenceForm.controls['contact_phone'].touched)
                }">
              </div>
            </div>
            <p *ngIf="referenceForm.get('contact_phone').touched &&
                (referenceForm.get('contact_phone').errors?.pattern || referenceForm.get('contact_phone').errors?.required || referenceForm.get('contact_phone').invalid)
              " class="validation-msg">
              <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>
              {{ 'phone_number_is_invalid' | i18next }}.
            </p>
          </div>
          <div class="col-md-12">
            <div class="form-group">
              <label>
                {{ 'email' | i18next }} <span class="require">*</span>
              </label>
              <input formControlName="contact_email" type="text" class="form-control"
                placeholder="{{ 'contact_person_email_address' | i18next }}" />
            </div>
            <p *ngIf="
            referenceForm.get('contact_email').touched &&
                (referenceForm.get('contact_email').errors?.pattern || referenceForm.get('contact_email').invalid)
              " class="validation-msg">
            <icon name="error" size="14px" type="material" cuClass="validation-icon"></icon>
            {{ 'email_can_not_be_blank' | i18next }}.
          </p>
          </div>
        </div>
      </div>
    </svms-sidebar-body>
    <svms-sidebar-footer>
      <div class="d-flex align-items-center justify-content-between">
        <button (click)="sideBaClose()"  type="button" class="btn btn-outline-secondary">
          {{ 'cancel' | i18next }}
        </button>
        <button [disabled]="referenceForm.invalid" (click)="referenceSubmit(index)" type="button" class="btn btn-primary">
          {{ 'save' | i18next }}
        </button>
      </div>
    </svms-sidebar-footer>
  </form>
</svms-sidebar>
