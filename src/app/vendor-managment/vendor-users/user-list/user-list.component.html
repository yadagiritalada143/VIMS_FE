<div class="users-list">
  <vms-table *ngIf="tableLoaded" [vmsTableConfig]="tableConfig" [vmsDataSource]="vmsData"  [loading]="dataLoading" [open]="isExpand" [totalItem]="totalRecords"
  [itemsPerPage]="itemsPerPage" (onViewClick)="onClickView($event)" (onExpandClick)="onExpandClick($event)" (onEditClick)="onEditClick($event)"
  (changePage)="onPaginationClick($event)" (onCreate)="onCreateClick($event)" (search)="onSearch($event)">
</vms-table>
</div>


<app-add-user [createManageUser]="isCreateUser" (onClose)="onCloseCreateUser($event)" [editData]="editData" [viewData]="viewData" [isViewClicked]="viewclick"></app-add-user>
