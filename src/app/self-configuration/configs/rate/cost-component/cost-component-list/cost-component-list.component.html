<app-svms-table [dataSource]="vmsData" [tableOptions]="tableOptions" [coloumnDefintions]="tableColumnConfig">
</app-svms-table>

<!-- template being used for showing ui of cost component status -->
<ng-template #statusTemplate let-value="value">
    <span class="c-status-ui active" *ngIf="value">
        {{ 'active' | i18next }}
    </span>
    <span class="c-status-ui inactive" *ngIf="!value">
        {{ 'inactive' | i18next }}
    </span>
</ng-template>
