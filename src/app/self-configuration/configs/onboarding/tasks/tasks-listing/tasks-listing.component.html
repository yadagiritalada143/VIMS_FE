<ng-template #statusTemplate let-value="value">
    <span class="c-status-ui active" *ngIf="value">
      {{ 'active' | i18next }}
    </span>
    <span class="c-status-ui inactive" *ngIf="!value">
      {{ 'inactive' | i18next }}
    </span>
</ng-template>

<ng-template #showData let-value="value">
    {{value | i18next}}
</ng-template>

<app-svms-table  [tableOptions]="tableOptions" [coloumnDefintions]="svmstableColomnDefn" [dataSource]="vmsData?.tasks"></app-svms-table>
