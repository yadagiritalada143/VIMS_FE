<ng-template #primary let-data let-value="value">
  <p class="text-visibility primary-text" (click)="onClickView(data)">
    {{ value | i18next }}
  </p>
</ng-template>

<ng-template #first let-value="value">
  <div class="text-visibility">
    {{ value | i18next }}
  </div>
</ng-template>

<app-svms-table 
  [tableOptions]="tableOptions"
  [coloumnDefintions]="svmstableColomnDefn"
  [dataSource]="svmsData">
</app-svms-table>
