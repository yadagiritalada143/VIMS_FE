<app-svms-table
    [dataSource]="vmsData"
    [tableOptions]="tableOptions"
    [coloumnDefintions]="tableColumnConfig"
>
</app-svms-table>

<ng-template #status let-value="value">
    <span class="c-status-ui active" *ngIf="value">
        {{ 'active' | i18next }}
      </span>
    <span class="c-status-ui inactive" *ngIf="!value">
        {{ 'inactive' | i18next }}
    </span>
</ng-template>

<ng-template #count let-value="value">
    <span class="initial-bg">
        {{ (value ?? 0) | i18next }}
    </span>
</ng-template>

<app-create-qualification-type
    [createQualificationType]="sidepanelVisible"
    (onClose)="onClose($event)"
></app-create-qualification-type>
