<form [formGroup]="formGroup">
    <app-program-config-control subtitle="disable_onboarding_tab"
        description="if_yes_then_the_system_will_hide_the_onboarding_tab_on_the_offer_and_assignment_modules"
        [type]="ControlType.TOGGLE" formControlName="is_onboading_disabled">
    </app-program-config-control>

    <app-program-config-control subtitle="disable_offer_acceptance_on_assignment_active_upon"
        description="during_offer_creation_there_is_a_required_field_called_assignment_active_upon_which_identifies_when_the_assignment_which_is_created_from_the_offer_will_move_to_an_open_status_by_default_onboarding_completion_will_always_appear_as_a_dropdown_value_for_this_field_this_particular_configuration_setting_allows_system_administrators_to_either_disable_or_enable_an_additional_dropdown_value_called_offer_acceptance"
        [type]="ControlType.TOGGLE" formControlName="is_offer_acceptance_disabled">
    </app-program-config-control>
</form>
