<ng-template #module let-value="value">
    <div class="text-overflow-template">
        {{ value }}
    </div>
</ng-template>

<ng-template #event let-row let-value="value">
    <div class="text-overflow-template cursor-pointer">
        <span (click)="onClickView(row)" style="color: #00338E;">
            {{ value }}
        </span>
    </div>
</ng-template>
