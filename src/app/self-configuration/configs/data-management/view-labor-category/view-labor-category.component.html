<div class="view-detail-page">
  <header class="section-header p-24 d-flex align-items-center justify-content-between">
    <div class="d-flex">
      <i class="material-icons back-arrow-icon cursor-pointer" (click)="back()" tooltip="Back" placement="bottom">arrow_back</i>
      <div class="ml-16">
        <h3 class="font-weight-semibold mb-0">{{details?.name}}</h3>
        <p class="small">Created on {{details?.created_on}}</p>
      </div>
    </div>
    <div>
      <button *ngIf="isAccessable" class="c-btn c-btn-secondary-medium-left-icon" (click)="editLabor()">
        <i class="material-icons">drive_file_rename_outline</i>Edit
      </button>
    </div>
  </header>

  <section class="section-body-content">
    <div class="px-32 py-16">
      <h4 class="font-weight-medium mb-16">Basic Details</h4>
      <app-common-view-rule-flow [details]="viewConfig">
      </app-common-view-rule-flow>
    </div>
  </section>
</div>
