<svms-sidebar title="{{'Create Candidate' | i18next}}" [dataVisibility]="isCreateCandidate" (onClose)="sidebarClose()">
    <svms-sidebar-body>
        <form>
            <div class="p-24">
                <div class="form-group-row">
                    <div class="form-group">
                        <label>{{'First Name' | i18next}} <span class="require">*</span></label>
                        <input type="text" class="form-control" placeholder="{{'First Name' | i18next}}">
                    </div>
                    <div class="form-group">
                        <label>{{'Middle Name' | i18next}}</label>
                        <input type="text" class="form-control" placeholder="{{'Middle Name' | i18next}}">
                    </div>
                    <div class="form-group">
                        <label>{{'Last Name' | i18next}} <span class="require">*</span></label>
                        <input type="text" class="form-control" placeholder="{{'Last Name' | i18next}}">
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group position-relative">
                        <label>{{'Date Of Birth' | i18next}}</label>
                        <svms-datepicker></svms-datepicker>
                    </div>
                    <div class="form-group">
                        <label>{{'State ID (Last 3 Digits)' | i18next}} <icon name="help_outline" theme="outlined"
                                color="#ADB5BD" size="14px"></icon></label>
                        <input type="text" class="form-control" placeholder="{{'Middle Name' | i18next}}">
                    </div>
                    <div class="form-group">
                        <label>{{'Vendor' | i18next}} <span class="require">*</span></label>
                        <input type="text" class="form-control" placeholder="{{'Last Name' | i18next}}">
                    </div>
                </div>
                <h4 class="font-weight-medium mt-24 mb-24">{{'Contact Info' | i18next}}</h4>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>{{'Email Address (Primary)' | i18next}} <span class="require">*</span></label>
                        <div class="field-icon position-relative">
                            <icon name="mail" class="d-flex align-items-center justify-content-center" cuClass="d-flex" theme="outlined" color="#000000" size="18px"></icon>
                            <input type="text" class="form-control" placeholder="{{'Enter Primary Email Address' | i18next}}">
                        </div>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group position-relative">
                        <label>{{'Country' | i18next}} <span class="require">*</span></label>
                        <ng-select placeholder="{{'Select' | i18next}}">
                            <ng-option value="Option 1">Option 1</ng-option>
                        </ng-select>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>{{ 'phone_number_(primary)' | i18next }}</label>
                        <div class="d-flex align-items-center position-relative">
                            <ng-select [searchable]="true" class="w-150" [clearable]="false">
                                <ng-option *ngFor="let country of allCountryList" [value]="country.iso_code_2">
                                    <img src="../../../assets/images/flag/{{country.iso_code_2.toLowerCase()}}.png"
                                        width="20px" class="mr-4" />
                                    <span>+{{country.isd_code}}</span>
                                </ng-option>
                            </ng-select>
                            <input type="number" 
                                class="form-control flex-fill remove-radius"
                                placeholder="{{ 'enter_primary_phone_number' | i18next }}">
                        </div>
                    </div>
                </div>
                <div class="form-group-row">
                    <div class="form-group">
                        <label>{{'Address (Primary)' | i18next}} <span class="require">*</span></label>
                        <div class="field-icon position-relative">
                            <icon name="home" class="d-flex align-items-center justify-content-center" cuClass="d-flex" theme="outlined" color="#000000" size="18px"></icon>
                            <input type="text" class="form-control" placeholder="{{'Enter Primary Address' | i18next}}">
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </svms-sidebar-body>
    <svms-sidebar-footer>
        <button type="submit" class="btn btn-primary float-right">
            {{'Continue' | i18next}}
        </button>
    </svms-sidebar-footer>
</svms-sidebar>
