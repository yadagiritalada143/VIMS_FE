<div class="border rounded-sm p-12 mb-24" *ngIf="showRemoteWorkerDetails">
  <p class="font-weight-medium mb-16 text-dark">{{'remote_worker_location'|i18next}}</p>
  <div class="row mb-24">
    <div class="col-md-4 d-flex-m">
      <p class="small d-flex-1-m">{{'Country'|i18next}}</p>
      <p class="d-flex-1-m">{{remoteWorkerDetails?.country || '--'}}</p>
    </div>
    <div class="col-md-4 d-flex-m">
      <p class="small d-flex-1-m">{{'state'|i18next}}</p>
      <p class="d-flex-1-m">{{remoteWorkerDetails?.state || '--'}}</p>
    </div>
    <div class="col-md-4 d-flex-m">
      <p class="small d-flex-1-m">{{'county'|i18next}}</p>
      <p class="d-flex-1-m">{{remoteWorkerDetails?.county || '--'}}</p>
    </div>
  </div>
  <div class="row">
    <div class="col-md-12 d-flex-m">
      <p class="small d-flex-1-m">{{'city'|i18next}}</p>
      <p class="d-flex-1-m">{{remoteWorkerDetails?.city || '--'}}</p>
    </div>
  </div>
</div>
