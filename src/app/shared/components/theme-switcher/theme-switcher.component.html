<li>
  <div class="radio-wrapper">
    <label class="radio-container" *ngFor="let theme of themes" [class]="theme">
      <input type="radio"  [(ngModel)]="colorTheme" (click)="handleClick($event, theme)" [value]="theme.id" name="theme">
      <span class="checkmark" [style.background]="getNavColor(theme)" [style.border-color]="getNavColor(theme)">
        <span class="second-color" [style.background]="getPrimaryColor(theme)"></span>
      </span>
    </label>
  </div>
</li>
