<button type="button" [ngbPopover]="popOverTemplate" #popDir="ngbPopover" 
    placement="{{placement}}" triggers="trigger"
    [ngClass]="{
        'trigger-button': true,
        'selected-trigger': popupService.selectedPopupId && popupService.selectedPopupId === id
    }"
    [autoClose]="autoClose" (click)="openPopOver(popDir)">
    <icon size="20px" [name]="iconName" type="material" class="d-flex op-5" cuClass="d-flex">
    </icon>
</button>
