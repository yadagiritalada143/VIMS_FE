<perfect-scrollbar [config]="{ suppressScrollX: true, suppressScrollY: false }">
    <div>
      <div class="program-search" >
        <input type="text"  [(ngModel)]="searchValue"
        (keyup.enter)="searchProgram()" (keyup)="searchProgram()" placeholder="{{ 'search_assignments' | i18next }}"  >
        <icon class="search-icon" name="search" size="18px"></icon>
      </div>
    
      <div class="p-24 pb-0" *ngIf="selectedAssignment()">
        <ng-container *ngFor="let a of selectedAssignment()">
          <p class="small font-weight-medium mb-16">{{ 'you_are_in' | i18next }}</p>
          <div class="program-items active-program d-flex align-items-center justify-content-between">
            <div class="d-flex">
              <figure>{{a?.assignment_title?.title | slice: 0 : 1}}</figure>
              <div class="assigment-title ml-16">
                <p>{{a?.assignment_title?.title}}</p>
                  <span class="d-flex align-items-center"><i class="material-icons cursor-pointer mr-8">label</i>
                    {{a?.code}}
                  </span>
              </div>
            </div>
            <div class="status-ui" [ngClass]="{'active': a?.status === 'Active', 'inactive': a?.status === 'In-Active'}">
              {{a?.status}}
            </div>
          </div>
        </ng-container>
      </div>

      <div class="p-24 pb-0" >
      <ng-container>
        <p class="small font-weight-medium mb-16 mt-32">{{ 'all_assignments' | i18next }}</p>
        <div class="all-program-list">
          <div class="mb-16" *ngFor="let a of assignment" (click)="navigateToDashboard(a?.assignment_uuid)">
            <div class="program-items d-flex align-items-center justify-content-between">
              <div class="d-flex">
                <figure>{{a?.assignment_title?.title | slice: 0 : 1}}</figure>
                <div class="assigment-title ml-16">
                  <p>{{a?.assignment_title?.title}}</p>
                    <span class="d-flex align-items-center"><i class="material-icons cursor-pointer mr-8">label</i>
                      {{a?.code}}
                    </span>
                </div>
              </div>
              <div class="status-ui" [ngClass]="{'active': a?.status === 'Active', 'inactive': a?.status === 'In-Active'}">
                {{a?.status}}
              </div>
              <!-- <div class="status-ui inactive">Inactive</div> -->
            </div>
          </div>

          <!-- <div
            class="mb-16">
            <div class="program-items d-flex align-items-center justify-content-between">

                </div>
              </div>
              <div class="status-ui inactive">Inactive</div>
            </div>
          </div> -->
        </div>
      </ng-container>
      </div>
