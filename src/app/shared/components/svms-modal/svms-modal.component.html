<div class="svms-modal {{size}}" [ngClass]="{'active' : visibility}">
    <header class="svms-modal-header">
        <a  class="close-modal">
            <i class="material-icons" (click)="closeModal()">close</i>
        </a>
        <h4 class="font-weight-medium mb-0" *ngIf="title">{{title | i18next}}</h4>
    </header>
    <div class="modal-body">
        <ng-content></ng-content>
    </div>
</div>
<div class="svms-modal-overlay" [ngClass]="{'active' : visibility}"></div>
