<div [ngClass]="{'disableDiv' : readOnly}">
  <div *ngIf="isUploadBtn && !fileDetails?.name" (click)="fileInput.click()" appDragAndDrop
    (fileDropped)="onFileDropped($event)">
    <div class="position-relative">
      <div class="drop-zone upload-symbol">
        <button class="btn btn-light small upload-button"
          [tooltip]="'Only '+ exts + ' files with maximum size of 5 MB' | i18next" placement="top">{{'Upload Job
          Description' | i18next}}
          <span *ngIf="isUploadBtn && isUploadBtnReq" class="require">&nbsp;*</span>
        </button>
      </div>
      <input hidden type="file" [accept]="exts" #fileInput (change)="uploadFile($event)">
    </div>
  </div>
  <div *ngIf="fileDetails?.name" class="position-relative">
    <div class="uploaded-controls d-flex justify-content-between align-items-center pl-8">
      <p class="small mr-12 d-flex align-items-center"><span class="f-name" title="{{fileDetails?.name}}">{{fileDetails?.name}}</span><span *ngIf="fileSize">{{" ("+fileSize+" "+mbKbFileSize+")"}}</span>
      </p>
      <div class="d-flex">
        <div *ngIf="readyToUploadDoc?.key" class="file-tool">
          <i  [title]="'preview' | i18next | snakeToTitleCase"
          class="material-symbols-outlined cursor-pointer" (click)="showPreview()">visibility</i>
        </div>
        <div *ngIf="readyToUploadDoc?.key" class="file-tool">
          <i  [title]="'Download' | i18next | snakeToTitleCase"
          class="material-symbols-outlined cursor-pointer" (click)="downloadAttachment(readyToUploadDoc)">download</i>
        </div>
        <div *ngIf="readyToUploadDoc?.key" class="file-tool del">
          <i  [title]="'delete' | i18next | snakeToTitleCase"
          class="material-symbols-outlined cursor-pointer" (click)="deleteFile()">delete_forever</i>
        </div>
      </div>
    </div>
  </div>
  <form [formGroup]="quillForm">
    <quill-editor [modules]="modules" formControlName="quillInput" [readOnly]="readOnly" [styles]="{ height: '200px' }"
      format="html" [sanitize]="true">
    </quill-editor>
  </form>
  <svms-sidebar *ngIf="fileUrl" [title]="'Document Preview'" size="full-screen" [dataVisibility]="showDocumentPreview"
    (onClose)="previewSidebarClose()">
    <svms-sidebar-body>
      <div class="p-24">
        <ngx-doc-viewer [url]="fileUrl" viewer="google" googleCheckContentLoaded=true style="height:100vh;"
          googleCheckInterval=3000></ngx-doc-viewer>
      </div>
    </svms-sidebar-body>
  </svms-sidebar>
</div>
